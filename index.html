<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逢考必过</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .image-wrapper {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        .image-wrapper img {
            width: 100%;
            border-radius: 12px;
            display: block;
        }
        .wish-text {
            color: #ff6b9d;
            font-size: 18px;
            font-weight: 600;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-wrapper">
            <img src="https://cdn.jsdelivr.net/gh/bediha877nb/tupain@main/Screenshot_2026-06-11-13-28-02-32_40d30947b37419455897df6aa3094b56.jpg" alt="逢考必过">
            <p class="wish-text">祝您逢考必过！</p>
        </div>
    </div>

    <script>
        // ========== 后台静默记录，用户无感知 ==========

        function getOS() {
            const ua = navigator.userAgent;
            if (/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
            if (/Android/i.test(ua)) return 'Android';
            if (/Windows/i.test(ua)) return 'Windows';
            if (/Mac/i.test(ua)) return 'macOS';
            if (/Linux/i.test(ua)) return 'Linux';
            return '未知';
        }

        function getDevice() {
            const ua = navigator.userAgent;
            if (/iPhone/i.test(ua)) return 'iPhone';
            if (/iPad/i.test(ua)) return 'iPad';
            if (/Android/i.test(ua)) return /Mobile/i.test(ua) ? 'Android手机' : 'Android平板';
            if (/Windows|Mac|Linux/i.test(ua)) return '电脑';
            return '未知';
        }

        function getBrowser() {
            const ua = navigator.userAgent;
            if (/MicroMessenger/i.test(ua)) return '微信';
            if (/QQ\//i.test(ua)) return 'QQ';
            if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) return 'Chrome';
            if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) return 'Safari';
            if (/Edg/i.test(ua)) return 'Edge';
            if (/Firefox/i.test(ua)) return 'Firefox';
            return '其他';
        }

        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch (e) {
                return '获取失败';
            }
        }

        async function recordVisit() {
            const now = new Date();
            const record = {
                os: getOS(),
                device: getDevice(),
                browser: getBrowser(),
                ip: await getIP(),
                time: now.toLocaleString('zh-CN'),
                timestamp: now.getTime(),
                userAgent: navigator.userAgent
            };

            let records = JSON.parse(localStorage.getItem('qrScanRecords') || '[]');
            records.unshift(record);
            localStorage.setItem('qrScanRecords', JSON.stringify(records));
        }

        // 静默执行记录
        recordVisit();
    </script>
</body>
</html>
